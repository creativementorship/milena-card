<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Milena Rajković — Creative Mentorship</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #eef7f5;
      --card: #ffffff;
      --teal: #3a9e8f;
      --teal-dark: #2c7d70;
      --teal-light: #6fc4b8;
      --teal-faint: rgba(58, 158, 143, 0.08);
      --teal-border: rgba(58, 158, 143, 0.2);
      --text: #1a2e2b;
      --muted: #6b8f8a;
      --soft: #9dbfba;
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    /* Soft background blobs */
    body::before {
      content: '';
      position: fixed;
      top: -10%;
      right: -10%;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(58,158,143,0.12) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -10%;
      left: -10%;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(111,196,184,0.1) 0%, transparent 65%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(420px, 92vw);
      margin: 2rem auto;
      background: var(--card);
      border-radius: 2px;
      box-shadow:
        0 1px 3px rgba(44,125,112,0.06),
        0 8px 32px rgba(44,125,112,0.1),
        0 0 0 1px var(--teal-border);
      overflow: hidden;
      animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    /* Top accent bar */
    .card-accent {
      height: 4px;
      background: linear-gradient(90deg, var(--teal) 0%, var(--teal-light) 60%, #a8ddd7 100%);
    }

    .card-body {
      padding: 2.4rem 2.2rem 2rem;
    }

    /* Logo */
    .logo {
      display: block;
      width: 90px;
      height: auto;
      margin-bottom: 1.2rem;
      animation: fadeUp 0.8s 0.1s cubic-bezier(0.16,1,0.3,1) both;
    }

    .name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.9rem, 7vw, 2.4rem);
      font-weight: 400;
      letter-spacing: -0.01em;
      line-height: 1.1;
      color: var(--text);
      animation: fadeUp 0.8s 0.12s cubic-bezier(0.16,1,0.3,1) both;
    }
    .name em {
      font-style: italic;
      color: var(--teal);
    }

    .title-block {
      margin-top: 0.7rem;
      animation: fadeUp 0.8s 0.18s cubic-bezier(0.16,1,0.3,1) both;
    }
    .role {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--teal);
    }
    .company {
      font-size: 0.95rem;
      font-weight: 300;
      color: var(--muted);
      margin-top: 0.15rem;
      letter-spacing: 0.01em;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin: 1.6rem 0;
      animation: fadeUp 0.8s 0.22s cubic-bezier(0.16,1,0.3,1) both;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--teal-border);
    }
    .divider-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--teal-light);
    }

    .contacts {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      animation: fadeUp 0.8s 0.26s cubic-bezier(0.16,1,0.3,1) both;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      text-decoration: none;
      color: var(--text);
      transition: color 0.2s;
      padding: 0.45rem 0.6rem;
      border-radius: 6px;
      transition: background 0.18s, color 0.18s;
    }
    .contact-item:hover {
      background: var(--teal-faint);
      color: var(--teal-dark);
    }
    .contact-item:hover .ci-icon {
      background: var(--teal);
      color: #fff;
    }

    .ci-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: var(--teal-faint);
      border: 1px solid var(--teal-border);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.18s, color 0.18s;
      color: var(--teal);
    }
    .ci-icon svg { width: 14px; height: 14px; }

    .ci-text {
      font-size: 0.8rem;
      font-weight: 400;
      color: inherit;
      word-break: break-all;
      letter-spacing: 0.01em;
    }

    /* Social buttons */
    .social-section {
      margin-top: 1.6rem;
      animation: fadeUp 0.8s 0.32s cubic-bezier(0.16,1,0.3,1) both;
    }
    .social-links {
      display: flex;
      gap: 0.6rem;
    }
    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
      flex: 1;
      padding: 0.65rem 0.5rem;
      border-radius: 8px;
      background: var(--teal-faint);
      border: 1px solid var(--teal-border);
      color: var(--teal-dark);
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .social-link:hover {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
    }
    .social-link svg { width: 14px; height: 14px; flex-shrink: 0; }

    .save-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      padding: 0.75rem;
      background: var(--teal);
      color: #fff;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      transition: background 0.2s;
    }
    .save-btn:hover { background: var(--teal-dark); }

    /* Footer tagline */
    .card-footer {
      margin-top: 1.8rem;
      padding-top: 1.2rem;
      border-top: 1px solid var(--teal-border);
      animation: fadeUp 0.8s 0.38s cubic-bezier(0.16,1,0.3,1) both;
    }
    .tagline {
      font-size: 0.7rem;
      color: var(--soft);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      font-weight: 400;
      text-align: center;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 380px) {
      .card-body { padding: 1.8rem 1.4rem 1.6rem; }
      .social-links { flex-direction: column; }
    }
  </style>
</head>
